<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Offers</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/ofertas-trabajo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

<!-- navbar -->
<nav class="navbar">
    <div>
        <strong>Job Portal</strong>
    </div>

    <div style="display: flex; align-items: center;">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/ofertas}" style="margin-left: 15px;">Offers</a>
        <a href="#" style="margin-left: 15px;">Profile</a>

        <!-- boton crear solo para admin y empresa -->
        <div sec:authorize="hasAnyRole('ADMIN', 'EMPRESA')" style="display: inline;">
            <a th:href="@{/ofertas/crear}" class="btn-create-nav"
               style="margin-left: 15px; background-color: #007bff; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
                <i class="ti ti-plus" aria-hidden="true"></i> Create Offer
            </a>
        </div>
    </div>
</nav>

<div class="jobs-layout">

    <!-- panel de filtros -->
    <aside class="filters-panel">
        <form action="/ofertas" method="get">

            <div class="filters-header">
                <h2>Filters</h2>
                <a href="/ofertas" class="clear-btn">Clear</a>
            </div>

            <div class="filter-box">
                <label>Search</label>
                <input type="text"
                       name="keyword"
                       placeholder="Title or company"
                       th:value="${param.keyword}">
            </div>

            <div class="filter-box">
                <label>Department</label>
                <select name="departamentoId">
                    <option value="">All</option>
                    <option th:each="d : ${departamentos}"
                            th:value="${d.idDepartamento}"
                            th:text="${d.departamento}"
                            th:selected="${param.departamentoId == d.idDepartamento}">
                    </option>
                </select>
            </div>

            <div class="filter-box">
                <label>Modality</label>
                <select name="modalidad">
                    <option value="">All</option>
                    <option th:each="m : ${T(com.crusaders.jobKey.enums.EModalidad).values()}"
                            th:value="${m}"
                            th:text="${m.value}">
                    </option>
                </select>
            </div>

            <div class="filter-box">
                <label>Experience Level</label>
                <select name="nivelRequerido">
                    <option value="">All</option>
                    <option value="JUNIOR" th:selected="${param.nivelRequerido == 'JUNIOR'}">Junior</option>
                    <option value="MID"    th:selected="${param.nivelRequerido == 'MID'}">Mid</option>
                    <option value="SENIOR" th:selected="${param.nivelRequerido == 'SENIOR'}">Senior</option>
                </select>
            </div>

            <button type="submit" class="search-btn">
                <i class="ti ti-filter" aria-hidden="true"></i> Apply Filters
            </button>

        </form>
    </aside>

    <!-- listado de ofertas -->
    <main class="jobs-content">
        <div class="jobs-list">

            <div th:if="${#lists.isEmpty(ofertas)}">
                <p>No job offers available.</p>
            </div>

            <div class="job-card" th:each="oferta : ${ofertas}">

                <!-- titulo y salario -->
                <div class="job-header">
                    <h3 th:text="${oferta.titulo}">Title</h3>
                    <span class="job-salary" th:text="${oferta.salario} + ' Q'">Salary</span>
                </div>

                <!-- empresa y ubicacion -->
                <div class="job-meta-grid" style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; color: #555; font-size: 0.9rem;">
                    <div class="job-company">
                        <i class="ti ti-building" aria-hidden="true"></i>
                        <span th:text="${oferta.nombreEmpresa}">Company</span>
                    </div>
                    <div class="job-location">
                        <i class="ti ti-map-pin" aria-hidden="true"></i>
                        <span th:text="${oferta.nombreDepartamento}">Department</span>
                    </div>
                </div>

                <!-- tags de modalidad, jornada y nivel -->
                <div class="job-tags" style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                    <span class="tag tag-modality" style="background-color: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500;">
                        <i class="ti ti-device-laptop" aria-hidden="true"></i>
                        <span th:text="${oferta.modalidad}">REMOTE</span>
                    </span>
                    <span class="tag tag-shift" style="background-color: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500;">
                        <i class="ti ti-clock" aria-hidden="true"></i>
                        <span th:text="${oferta.tipoJornada}">FULL_TIME</span>
                    </span>
                    <span class="tag tag-level" style="background-color: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500;">
                        <i class="ti ti-school" aria-hidden="true"></i>
                        <span th:text="${oferta.nivelRequerido}">JUNIOR</span>
                    </span>
                </div>

                <!-- descripcion y requisitos -->
                <div class="job-section" style="margin-bottom: 10px;">
                    <strong style="font-size: 0.9rem; color: #333;">Description:</strong>
                    <p class="job-description" th:text="${oferta.descripcion}"
                       style="margin-top: 4px; color: #444; line-height: 1.4;">Description</p>
                </div>
                <div class="job-section" style="margin-bottom: 15px;">
                    <strong style="font-size: 0.9rem; color: #333;">Requirements:</strong>
                    <p class="job-requirements" th:text="${oferta.requisitos}"
                       style="margin-top: 4px; color: #444; line-height: 1.4; font-style: italic;">Requirements</p>
                </div>

                <!-- pie de card: fechas y acciones -->
                <div class="job-footer" style="border-top: 1px solid #eee; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">

                    <!-- fechas -->
                    <div class="job-dates" style="display: flex; flex-direction: column; gap: 2px; font-size: 0.8rem; color: #666;">
                        <div>
                            <i class="ti ti-calendar-plus" aria-hidden="true"></i> Published:
                            <span th:text="${#temporals.format(oferta.fechaPublicacion, 'dd/MM/yyyy')}">01/01/2026</span>
                        </div>
                        <div th:if="${oferta.fechaCierre != null}" style="color: #dc3545; font-weight: 500;">
                            <i class="ti ti-calendar-x" aria-hidden="true"></i> Deadline:
                            <span th:text="${#temporals.format(oferta.fechaCierre, 'dd/MM/yyyy')}">31/12/2026</span>
                        </div>
                    </div>

                    <!-- acciones solo para admin y empresa -->
                    <div class="job-actions" sec:authorize="hasAnyRole('ADMIN', 'EMPRESA')">
                        <a th:href="@{'/ofertas/editar/' + ${oferta.idOfertaTrabajo}}"
                           style="margin-right: 10px; color: #007bff; text-decoration: none; font-weight: 500;">
                            <i class="ti ti-edit" aria-hidden="true"></i> Edit
                        </a>
                        <a th:href="@{'/ofertas/eliminar/' + ${oferta.idOfertaTrabajo}}"
                           onclick="return confirm('Are you sure you want to delete this offer?')"
                           style="color: #dc3545; text-decoration: none; font-weight: 500;">
                            <i class="ti ti-trash" aria-hidden="true"></i> Delete
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </main>

</div>

</body>
</html>
