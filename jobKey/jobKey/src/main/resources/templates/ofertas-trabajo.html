<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Offers</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/ofertas-trabajo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

<div th:replace="~{navbar :: nav}"></div>

<nav class="navbar">
    <div>
        <strong>Job Portal</strong>
    </div>

    <div style="display: flex; align-items: center;">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/ofertas}" style="margin-left: 15px;">Offers</a>
        <a th:href="@{/candidatos}" style="margin-left: 15px;">Profile</a>

        <div sec:authorize="hasAnyRole('ADMIN', 'EMPRESA')" style="display: inline;">
            <a th:href="@{/ofertas/crear}" class="btn-create-nav"
               style="margin-left: 15px; background-color: #007bff; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
                <i class="ti ti-plus" aria-hidden="true"></i> Create Offer
            </a>
        </div>
    </div>
</nav>

<div class="jobs-layout">

    <aside class="filters-panel">
        <form action="/ofertas" method="get">
            <div class="filters-header">
                <h2>Filters</h2>
                <a href="/ofertas" class="clear-btn">Clear</a>
            </div>

            <div class="filter-box">
                <label>Search</label>
                <input type="text" name="keyword" placeholder="Title or company" th:value="${param.keyword}">
            </div>

            <div class="filter-box">
                <label>Department</label>
                <select name="departamentoId">
                    <option value="">All</option>
                    <option th:each="d : ${departamentos}"
                            th:value="${d.idDepartamento}"
                            th:text="${d.departamento}"
                            th:selected="${param.departamentoId == d.idDepartamento}">
                    </option>
                </select>
            </div>

            <div class="filter-box">
                <label>Modality</label>
                <select name="modalidad">
                    <option value="">All</option>
                    <option th:each="m : ${T(com.crusaders.jobKey.enums.EModalidad).values()}"
                            th:value="${m}"
                            th:text="${m.value}">
                    </option>
                </select>
            </div>

            <button type="submit" class="search-btn">
                <i class="ti ti-filter" aria-hidden="true"></i> Apply Filters
            </button>
        </form>
    </aside>

    <main class="jobs-content">
        <div class="jobs-list">
            <div th:if="${#lists.isEmpty(ofertas)}">
                <p>No job offers available.</p>
            </div>

            <div class="job-card" th:each="oferta : ${ofertas}">
                <div class="job-header">
                    <h3 th:text="${oferta.titulo}">Title</h3>
                    <span class="job-salary" th:text="${oferta.salario} + ' Q'">Salary</span>
                </div>

                <div class="job-meta-grid" style="display: flex; gap: 15px; margin-bottom: 10px; color: #555; font-size: 0.9rem;">
                    <div><i class="ti ti-building"></i> <span th:text="${oferta.nombreEmpresa}">Company</span></div>
                    <div><i class="ti ti-map-pin"></i> <span th:text="${oferta.nombreDepartamento}">Dept</span></div>
                </div>

                <div class="job-tags" style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <span class="tag" style="background-color: #e2e8f0; padding: 4px 8px; border-radius: 4px;" th:text="${oferta.modalidad}"></span>
                    <span class="tag" style="background-color: #e2e8f0; padding: 4px 8px; border-radius: 4px;" th:text="${oferta.tipoJornada}"></span>
                </div>

                <p class="job-description" th:text="${oferta.descripcion}" style="margin-bottom: 10px; color: #444;"></p>

                <div class="job-footer" style="border-top: 1px solid #eee; padding-top: 10px; display: flex; justify-content: space-between; align-items: center;">

                    <div sec:authorize="hasRole('CANDIDATO')">
                        <form th:action="@{/postulaciones/aplicar/{id}(id=${oferta.idOfertaTrabajo})}" method="post">
                            <button type="submit" class="btn" style="background-color: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                                <i class="ti ti-send"></i> Apply Now
                            </button>
                        </form>
                    </div>

                    <div class="job-actions" th:if="${oferta.empresaId == idEmpresaUsuario or esAdmin}">
                        <a th:href="@{'/ofertas/editar/' + ${oferta.idOfertaTrabajo}}" style="margin-right: 10px; color: #007bff; text-decoration: none;">Edit</a>
                        <a th:href="@{'/ofertas/eliminar/' + ${oferta.idOfertaTrabajo}}" onclick="return confirm('Delete?')" style="color: #dc3545; text-decoration: none;">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
