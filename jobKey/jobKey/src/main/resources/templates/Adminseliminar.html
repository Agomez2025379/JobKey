<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Eliminar Administrador – JobKey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>

<nav class="navbar">
    <span class="navbar-brand">⚿ JobKey Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/admins}" style="color:var(--accent)">Admins</a>
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</nav>

<div class="container" style="max-width:480px">

    <div class="page-header">
        <div>
            <a th:href="@{/admin/admins}" class="back-link">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a admins
            </a>
            <h1 class="page-title" style="margin-top:.5rem">Eliminar Administrador</h1>
        </div>
    </div>

    <div class="card delete-confirm-card">

        <!-- Icono de advertencia -->
        <div class="delete-icon">
            <i class="ti ti-alert-triangle" aria-hidden="true"></i>
        </div>

        <p class="delete-msg">
            ¿Estás seguro de que deseas eliminar al administrador
            <strong th:text="${admin.nombre}">Nombre</strong>?
        </p>
        <p class="delete-sub">
            Esta acción eliminará también su cuenta de usuario (<span th:text="${admin.email}">email</span>).
            <strong>No se puede deshacer.</strong>
        </p>

        <!-- Info del admin -->
        <div class="delete-info">
            <div class="info-row">
                <span class="info-label">Email</span>
                <span th:text="${admin.email}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Registrado el</span>
                <span th:text="${#temporals.format(admin.fechaRegistro, 'dd MMM yyyy')}">—</span>
            </div>
        </div>

        <form th:action="@{/admin/admins/eliminar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="id" th:value="${admin.idAdmin}"/>

            <div class="form-actions">
                <a th:href="@{/admin/admins}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">
                    <i class="ti ti-trash" aria-hidden="true"></i> Sí, eliminar
                </button>
            </div>
        </form>
    </div>

</div>

</body>
</html>
