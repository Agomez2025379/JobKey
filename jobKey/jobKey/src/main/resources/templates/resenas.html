<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobKey - Reseñas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .reviews-container { max-width: 700px; margin: 3rem auto; padding: 0 1rem; }
        .rating-select { display: flex; gap: 0.5rem; margin: 0.5rem 0 1.2rem; }
        .star-input { font-size: 1.5rem; cursor: pointer; color: #CCC; transition: color 0.2s; }
        .star-input.active { color: #F59E0B; }
        .anonymous-badge { background: #E2E8F0; color: #475569; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-bottom: 1rem; }
        .review-card-item { background: var(--white); border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 2px 4px var(--shadow); border-left: 4px solid var(--accent); }
        .review-card-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748B; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

<div class="reviews-container">
    <div class="card" id="formContainer">
        <h2>Dejar una Reseña</h2>
        <span class="anonymous-badge">🔒 Tu opinión será totalmente anónima</span>

        <form id="reviewForm">
            <input type="hidden" id="ofertaId" name="ofertaId">

            <label>Calificación:</label>
            <div class="rating-select" id="starSelector">
                <span class="star-input" data-value="1">★</span>
                <span class="star-input" data-value="2">★</span>
                <span class="star-input" data-value="3">★</span>
                <span class="star-input" data-value="4">★</span>
                <span class="star-input" data-value="5">★</span>
            </div>

            <label for="comentario">Tu comentario:</label>
            <textarea id="comentario" rows="4" placeholder="Escribe tu experiencia aquí..." required></textarea>

            <button type="submit" class="btn">Enviar Reseña Anónima</button>
        </form>
    </div>

    <br>

    <div class="reviews-feed">
        <h3>Historial de Opiniones</h3>
        <div id="reviewsList">
        </div>
    </div>
</div>

<script>
    let selectedRating = 0;

    document.addEventListener("DOMContentLoaded", () => {
        // 1. Capturar los parámetros de la URL (ej: ?ofertaId=3)
        const urlParams = new URLSearchParams(window.location.search);
        const ofertaId = urlParams.get('ofertaId');

        if(ofertaId) {
            document.getElementById('ofertaId').value = ofertaId;
        }

        // 2. Control interactivo de las estrellas
        const stars = document.querySelectorAll('.star-input');
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                selectedRating = parseInt(e.target.getAttribute('data-value'));
                stars.forEach(s => {
                    if(parseInt(s.getAttribute('data-value')) <= selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });

        // 3. Carga inicial de las reseñas existentes
        loadReviews();

        // 4. Envío del formulario por Fetch (POST)
        document.getElementById('reviewForm').addEventListener('submit', (e) => {
            e.preventDefault();

            if(selectedRating === 0) {
                alert("Por favor, selecciona una calificación de estrellas.");
                return;
            }


            const reviewData = {
                tipo: "candidato_a_empresa",
                ofertaId: document.getElementById('ofertaId').value ? parseInt(document.getElementById('ofertaId').value) : null,
                puntuacion: selectedRating,
                comentario: document.getElementById('comentario').value
            };

            fetch('/api/resenas/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reviewData)
            })
            .then(res => {
                if(!res.ok) throw new Error("Error al guardar");
                return res.json();
            })
            .then(() => {
                alert("Reseña anónima guardada con éxito.");
                document.getElementById('reviewForm').reset();
                stars.forEach(s => s.classList.remove('active'));
                selectedRating = 0;
                loadReviews();
            })
            .catch(err => alert("Hubo un problema al enviar la reseña."));
        });
    });

    function loadReviews() {
        const list = document.getElementById('reviewsList');
        fetch('/api/resenas/get')
            .then(res => res.json())
            .then(data => {
                list.innerHTML = "";
                if(data.length === 0) {
                    list.innerHTML = "<p>No hay reseñas registradas aún.</p>";
                    return;
                }
                data.forEach(item => {
                    const starsText = "★".repeat(item.puntuacion) + "☆".repeat(5 - item.puntuacion);
                    const card = document.createElement('div');
                    card.className = "review-card-item";
                    card.innerHTML = `
                        <div class="review-card-header">
                            <span>🔒 Anónimo</span>
                            <span style="color:#F59E0B;">${starsText}</span>
                        </div>
                        <p class="comment-text">"${item.comentario}"</p>
                    `;
                    list.appendChild(card);
                });
            });
    }
</script>
</body>
</html>
