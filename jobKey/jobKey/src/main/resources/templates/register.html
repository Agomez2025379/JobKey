<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobKey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="flex-center">
<div class="auth-card">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Join <span style="color: var(--accent-hover)">JobKey</span></h2>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="nombre" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label>I am a:</label>
            <select name="rol" required style="cursor: pointer;">
                <option value="CANDIDATO">Candidate (Looking for job)</option>
                <option value="EMPRESA">Company (Hiring talent)</option>
                <option value="INSTITUCION">Institution</option>
            </select>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Already member? <a th:href="@{/login}" style="color: var(--primary); font-weight: bold;">Log In</a>
    </p>
</div>
</body>
</html>
