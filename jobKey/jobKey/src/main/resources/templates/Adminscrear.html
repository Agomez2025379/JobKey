<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuevo Administrador – JobKey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>

<nav class="navbar">
    <span class="navbar-brand">⚿ JobKey Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/admins}" style="color:var(--accent)">Admins</a>
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</nav>

<div class="container" style="max-width:540px">

    <div class="page-header">
        <div>
            <a th:href="@{/admin/admins}" class="back-link">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a admins
            </a>
            <h1 class="page-title" style="margin-top:.5rem">Nuevo Administrador</h1>
        </div>
    </div>

    <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

    <div class="card">
        <form th:action="@{/admin/admins/crear}" method="post" onsubmit="return validarCrear()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       th:value="${adminRequest?.nombre}"
                       placeholder="Ej: Carlos Méndez"
                       required/>
                <span class="field-error" id="err-nombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       th:value="${adminRequest?.email}"
                       placeholder="admin@jobkey.com"
                       required/>
                <span class="field-error" id="err-email"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-icon-right">
                    <input type="password" id="password" name="password"
                           placeholder="Mínimo 8 caracteres"
                           required minlength="8"/>
                    <button type="button" class="toggle-pass" onclick="togglePass('password', this)" aria-label="Mostrar contraseña">
                        <i class="ti ti-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <span class="field-error" id="err-pass"></span>
            </div>

            <div class="form-group">
                <label for="password2">Confirmar contraseña</label>
                <div class="input-icon-right">
                    <input type="password" id="password2"
                           placeholder="Repite la contraseña"
                           required/>
                    <button type="button" class="toggle-pass" onclick="togglePass('password2', this)" aria-label="Mostrar contraseña">
                        <i class="ti ti-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <span class="field-error" id="err-pass2"></span>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/admins}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="ti ti-check" aria-hidden="true"></i> Crear admin
                </button>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/js/admins.js}"></script>
</body>
</html>
