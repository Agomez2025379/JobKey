<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Formulario Institución</title>
    <link rel="stylesheet" th:href="@{/css/instituciones.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div th:replace="~{navbar :: nav}"></div>

<div class="container" style="max-width: 600px; margin-top: 20px;">
    <div class="header">
        <a th:href="@{/instituciones}" class="btn" style="background: #64748b;">← Volver</a>
        <h1 th:text="${accion == 'crear' ? 'Nueva Institución' : 'Editar Institución'}">Formulario</h1>
    </div>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/instituciones/guardar}" method="post">
            <input type="hidden" name="idInstitucion" th:value="${institucion.idInstitucion}" />

            <div class="form-group">
                <label>Email del usuario *</label>
                <input type="email" name="email" th:value="${institucion.email}" required
                       placeholder="ejemplo@institucion.com" />
                <small>El usuario debe existir en el sistema</small>
            </div>

            <div class="form-group">
                <label>Nombre de la Institución *</label>
                <input type="text" name="nombreInstitucion" th:value="${institucion.nombreInstitucion}" required />
            </div>

            <div class="form-group">
                <label>Tipo *</label>
                <select name="tipo" required>
                    <option value="UNIVERSIDAD" th:selected="${institucion.tipo == 'UNIVERSIDAD'}">Universidad</option>
                    <option value="INSTITUTO" th:selected="${institucion.tipo == 'INSTITUTO'}">Instituto</option>
                    <option value="COLEGIO" th:selected="${institucion.tipo == 'COLEGIO'}">Colegio</option>
                </select>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="telefono" th:value="${institucion.telefono}" />
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" rows="3">[[${institucion.descripcion}]]</textarea>
            </div>

            <div class="form-group">
                <label>Departamento *</label>
                <select name="departamentoId" required>
                    <option value="">-- Seleccione un departamento --</option>
                    <option th:each="dep : ${departamentos}"
                            th:value="${dep.idDepartamento}"
                            th:text="${dep.departamento}"
                            th:selected="${institucion.departamentoId == dep.idDepartamento}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Logo</label>
                <div th:if="${institucion.logoBase64 != null}" style="margin-bottom: .75rem;">
                    <img th:src="'data:image/jpeg;base64,' + ${institucion.logoBase64}"
                         style="width:80px; height:80px; border-radius:50%; object-fit:cover;"/>
                    <p style="font-size:.8rem; color:#64748b; margin-top:.25rem;">Logo actual</p>
                </div>
                <input type="file" id="logoInput" accept="image/*" onchange="convertirBase64(this)"/>
                <img id="logoPreview" style="display:none; width:80px; height:80px;
                     border-radius:50%; object-fit:cover; margin-top:.5rem;"/>
                <input type="hidden" name="logoBase64" id="logoBase64"/>
            </div>

            <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn" style="background: #1B2A4A;">Guardar</button>
                <a th:href="@{/instituciones}" class="btn" style="background: #64748b;">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/instituciones.js}"></script>
</body>
</html>
