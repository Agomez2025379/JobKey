<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobKey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="flex-center">
<div class="auth-card">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome back to <span style="color: var(--accent-hover)">JobKey</span></h2>

    <!-- Error Message -->
    <div th:if="${param.error}" style="background-color: var(--error); color: white; padding: 10px; border-radius: 5px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem;">
        Invalid email or password. Please try again.
    </div>

    <!-- Logout Success Message -->
    <div th:if="${param.logout}" style="background-color: var(--success); color: white; padding: 10px; border-radius: 5px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem;">
        You have been signed out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="username" placeholder="example@mail.com" required autofocus>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Don't have an account? <a th:href="@{/register}" style="color: var(--primary); font-weight: bold;">Create one here</a>
    </p>
</div>
</body>
</html>
