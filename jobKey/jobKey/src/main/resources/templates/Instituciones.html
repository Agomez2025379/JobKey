<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Instituciones - JobKey</title>
    <link rel="stylesheet" th:href="@{/css/instituciones.css}">
</head>
<body>

<nav class="navbar">
    <div>
        <strong>JobKey Admin</strong>
    </div>
    <div>
        <a th:href="@{/instituciones}">Instituciones</a>
        <a href="/usuarios">Usuarios</a>
    </div>
</nav>

<div class="container">
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="header">
        <h1>🏢 Instituciones</h1>
        <a th:href="@{/instituciones/nueva}" class="btn">➕ Nueva</a>
    </div>

    <div class="card">
        <div class="table-container">
            <table id="tablaInstituciones">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Logo</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="inst : ${instituciones}">
                    <td th:text="${inst.idInstitucion}">1</td>
                    <td>
                        <div class="logo-placeholder"
                             th:text="${inst.nombreInstitucion != null ? inst.nombreInstitucion.charAt(0) : 'I'}">
                        </div>
                    </td>
                    <td th:text="${inst.nombreInstitucion}">Nombre</td>
                    <td>
                        <span class="badge"
                              th:classappend="'badge-' + ${inst.tipo}"
                              th:text="${inst.tipo}">
                        </span>
                    </td>
                    <td th:text="${inst.telefono}">12345678</td>
                    <td>
                        <a th:href="@{/instituciones/editar/{id}(id=${inst.idInstitucion})}" class="btn btn-sm">Editar</a>
                        <a th:href="@{/instituciones/eliminar/{id}(id=${inst.idInstitucion})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Eliminar esta institución?')">
                            Eliminar
                        </a>
                    </td>
                </tr>

                <tr th:if="${instituciones.empty}">
                    <td colspan="6" style="text-align: center;">No hay instituciones registradas</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/instituciones.js}"></script>

</body>
</html>
