<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Instituciones - JobKey</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/instituciones.css}">

    <style>
        .table-container {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #E2E8F0;
        }

        th {
            background-color: var(--accent);
            color: var(--primary);
            font-weight: 600;
        }

        tr:hover {
            background-color: var(--card-hover);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-activa { background: var(--success); color: white; }
        .badge-inactiva { background: var(--error); color: white; }
        .badge-pendiente { background: #f59e0b; color: white; }

        .badge-universidad { background: #3b82f6; color: white; }
        .badge-empresa { background: #10b981; color: white; }
        .badge-instituto { background: #8b5cf6; color: white; }
        .badge-ong { background: #ef4444; color: white; }

        .logo-placeholder {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-icon {
            background: none;
            border: none;
            padding: 0.5rem;
            margin: 0 0.25rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-edit { color: var(--primary); }
        .btn-edit:hover { background: var(--accent); transform: scale(1.1); }

        .btn-delete { color: var(--error); }
        .btn-delete:hover { background: var(--error); color: white; transform: scale(1.1); }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #E2E8F0;
            background: var(--white);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary);
            color: white;
            border-radius: 16px 16px 0 0;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid #E2E8F0;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div>
        <i class="fas fa-briefcase"></i>
        <strong>JobKey Admin</strong>
    </div>
    <div>
        <a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/instituciones"><i class="fas fa-building"></i> Instituciones</a>
        <a href="/vacantes"><i class="fas fa-briefcase"></i> Vacantes</a>
        <a href="/usuarios"><i class="fas fa-users"></i> Usuarios</a>
    </div>
</nav>

<div class="container">
    <div class="flex-between" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1><i class="fas fa-building"></i> Instituciones</h1>
        <button class="btn" style="width: auto;" onclick="openCreateModal()">
            <i class="fas fa-plus"></i> Nueva Institución
        </button>
    </div>

    <!-- Filtros -->
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="filters">
            <div>
                <label>Buscar</label>
                <input type="text" id="searchInput" placeholder="Nombre, NIT o email...">
            </div>
            <div>
                <label>Tipo</label>
                <select id="tipoFilter">
                    <option value="">Todos</option>
                    <option value="UNIVERSIDAD">Universidad</option>
                    <option value="EMPRESA">Empresa</option>
                    <option value="INSTITUTO">Instituto</option>
                    <option value="ONG">ONG</option>
                </select>
            </div>
            <div>
                <label>Estado</label>
                <select id="estadoFilter">
                    <option value="">Todos</option>
                    <option value="ACTIVA">Activa</option>
                    <option value="INACTIVA">Inactiva</option>
                    <option value="PENDIENTE">Pendiente</option>
                </select>
            </div>
            <div>
                <label>&nbsp;</label>
                <button class="btn" style="background: #64748b; width: auto;" onclick="resetFilters()">
                    <i class="fas fa-undo"></i> Limpiar
                </button>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Logo</th>
                <th>Nombre</th>
                <th>NIT</th>
                <th>Tipo</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="institucionesBody">
            <tr>
                <td colspan="9" style="text-align: center; padding: 2rem;">
                    <i class="fas fa-spinner fa-spin"></i> Cargando...
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" id="pagination"></div>
        <div style="text-align: center; margin-top: 1rem;">
            <span id="paginationInfo"></span>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="institucionModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-building"></i> Nueva Institución</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="institucionForm">
                <input type="hidden" id="id">

                <div>
                    <label>Nombre *</label>
                    <input type="text" id="nombre" required>
                </div>

                <div>
                    <label>NIT *</label>
                    <input type="text" id="nit" required>
                </div>

                <div>
                    <label>Tipo *</label>
                    <select id="tipo" required>
                        <option value="">Seleccionar...</option>
                        <option value="UNIVERSIDAD">Universidad</option>
                        <option value="EMPRESA">Empresa</option>
                        <option value="INSTITUTO">Instituto</option>
                        <option value="ONG">ONG</option>
                    </select>
                </div>

                <div>
                    <label>Estado *</label>
                    <select id="estado" required>
                        <option value="ACTIVA">Activa</option>
                        <option value="INACTIVA">Inactiva</option>
                        <option value="PENDIENTE">Pendiente</option>
                    </select>
                </div>

                <div>
                    <label>Logo URL</label>
                    <input type="url" id="logoUrl" placeholder="https://ejemplo.com/logo.png">
                </div>

                <div>
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>

                <div>
                    <label>Teléfono</label>
                    <input type="tel" id="telefono">
                </div>

                <div>
                    <label>Dirección</label>
                    <textarea id="direccion" rows="2"></textarea>
                </div>

                <div>
                    <label>Descripción</label>
                    <textarea id="descripcion" rows="3"></textarea>
                </div>

                <div>
                    <label>Sitio Web</label>
                    <input type="url" id="sitioWeb" placeholder="https://">
                </div>

                <div>
                    <label>Fecha de Registro</label>
                    <input type="date" id="fechaRegistro">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn" onclick="saveInstitucion()">Guardar</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/instituciones.js}"></script>
</body>
</html>
