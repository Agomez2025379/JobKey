<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestión de Usuarios – JobKey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/css/Usuarios.css}"/>>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>

<div th:replace="~{navbar :: nav}"></div>

<div class="container">

    <!-- FLASH -->
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}"   class="alert alert-error"   th:text="${errorMsg}"></div>

    <!-- HEADER -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Gestión de Usuarios</h1>
            <p class="page-subtitle">Todos los usuarios registrados en el sistema</p>
        </div>
    </div>

    <!-- STAT CARDS -->
    <div class="stats" style="grid-template-columns: repeat(5,1fr)">
        <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-value" th:text="${totalUsuarios}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Admins</div>
            <div class="stat-value" th:text="${totalAdmins}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Empresas</div>
            <div class="stat-value" th:text="${totalEmpresas}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Candidatos</div>
            <div class="stat-value" th:text="${totalCandidatos}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Instituciones</div>
            <div class="stat-value" th:text="${totalInstituciones}">0</div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="card">
        <div class="search-bar">
            <input type="text" id="search" placeholder="Buscar por email o rol…" oninput="filtrar()"/>
        </div>

        <table id="tabla">
            <thead>
            <tr>
                <th>#</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Fecha registro</th>
                <th>Último acceso</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}"
                th:attr="data-email=${u.email}, data-rol=${u.rol}">

                <td th:text="'#' + ${u.idUsuario}" style="color:#94a3b8;font-size:.8rem"></td>

                <td>
                    <div class="user-cell">
                        <div class="initials"
                             th:text="${#strings.toUpperCase(#strings.substring(u.email,0,1))}">U</div>
                        <span th:text="${u.email}">email@jobkey.com</span>
                    </div>
                </td>

                <td>
                        <span th:class="${'badge badge-' + #strings.toLowerCase(u.rol.name())}"
                              th:text="${u.rol.getValue()}">rol</span>
                </td>

                <td th:text="${#temporals.format(u.fechaRegistro, 'dd MMM yyyy')}">—</td>

                <td th:text="${u.ultimoAcceso != null
                                  ? #temporals.format(u.ultimoAcceso, 'dd MMM yyyy HH:mm')
                                  : '—'}">—</td>

                <td>
                    <div class="actions">
                        <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                           class="btn btn-edit btn-sm">
                            <i class="ti ti-edit" aria-hidden="true"></i> Editar
                        </a>
                        <a th:href="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                           class="btn btn-delete btn-sm">
                            <i class="ti ti-trash" aria-hidden="true"></i> Eliminar
                        </a>
                    </div>
                </td>
            </tr>

            <tr id="empty-row" style="display:none">
                <td colspan="6" class="empty-state">
                    <i class="ti ti-user-off" aria-hidden="true"></i>
                    No se encontraron usuarios.
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${usuarios.empty}" class="empty-state">
            <i class="ti ti-users-off" aria-hidden="true"></i>
            No hay usuarios registrados.
        </div>
    </div>

</div>

<script th:src="@{/js/usuarios.js}"></script>
</body>
</html>
