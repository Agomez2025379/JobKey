<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Editar Administrador – JobKey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>

<nav class="navbar">
    <span class="navbar-brand">⚿ JobKey Admin</span>
    <div>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/admins}" style="color:var(--accent)">Admins</a>
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>
</nav>

<div class="container" style="max-width:540px">

    <div class="page-header">
        <div>
            <a th:href="@{/admin/admins}" class="back-link">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a admins
            </a>
            <h1 class="page-title" style="margin-top:.5rem">Editar Administrador</h1>
            <p class="page-subtitle" th:text="'Editando: ' + ${admin.nombre}">Editando: —</p>
        </div>
    </div>

    <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

    <div class="card">
        <form th:action="@{/admin/admins/editar}" method="post" onsubmit="return validarEditar()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="id" th:value="${admin.idAdmin}"/>

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       th:value="${admin.nombre}"
                       required/>
                <span class="field-error" id="err-nombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       th:value="${admin.email}"
                       required/>
                <span class="field-error" id="err-email"></span>
            </div>

            <!-- Info de solo lectura -->
            <div class="info-row">
                <span class="info-label"><i class="ti ti-calendar" aria-hidden="true"></i> Fecha de registro</span>
                <span th:text="${#temporals.format(admin.fechaRegistro, 'dd MMM yyyy')}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="ti ti-clock" aria-hidden="true"></i> Último acceso</span>
                <span th:text="${admin.ultimoAcceso != null ? #temporals.format(admin.ultimoAcceso, 'dd MMM yyyy HH:mm') : 'Nunca'}">—</span>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/admins}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="ti ti-check" aria-hidden="true"></i> Guardar cambios
                </button>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/js/admins.js}"></script>
</body>
</html>
